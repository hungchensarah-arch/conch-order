<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🐚 幸福海螺 Conch Baking 團購助手</title>
    <style>
        body {
            font-family: 'Segoe UI', "Microsoft JhengHei", sans-serif;
            background: linear-gradient(135deg, #fceeb5, #f5cd79);
            min-height: 100vh;
            display: flex; justify-content: center; align-items: center; margin: 0; padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background-color: white; padding: 25px; border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15); width: 100%; max-width: 500px;
        }
        .logo-area { text-align: center; margin-bottom: 10px; }
        .logo-title { color: #cf6a17; margin: 0; font-size: 26px; font-weight: bold; }
        .subtitle { color: #636e72; margin-bottom: 20px; text-align: center; font-size: 13px; }
        
        .name-group {
            margin-bottom: 20px; background: #fff8eb; padding: 15px;
            border-radius: 12px; border: 1px solid #ffeaa7;
        }
        label { display: block; font-weight: bold; margin-bottom: 8px; color: #2d3436; }
        input[type="text"] {
            width: 100%; padding: 12px; border: 2px solid #dfe6e9;
            border-radius: 10px; font-size: 16px; box-sizing: border-box; outline: none;
        }
        input[type="text"]:focus { border-color: #e67e22; }

        .menu-section-title {
            font-size: 14px; color: #7f8c8d; font-weight: bold;
            margin: 15px 0 8px 5px; border-left: 3px solid #e67e22; padding-left: 8px;
        }
        .menu-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 10px; border-bottom: 1px solid #f1f2f6;
        }
        .item-details { text-align: left; }
        .item-name { font-weight: bold; color: #2d3436; font-size: 16px; }
        .item-price { color: #e67e22; font-size: 14px; font-weight: bold; margin-top: 2px; }
        
        /* 數量控制區 */
        .counter { display: flex; align-items: center; gap: 12px; }
        
        /* 將按鈕改為純 div，徹底解決手機點擊失效問題 */
        .btn-calc {
            background-color: #f1f2f6; width: 36px; height: 36px;
            border-radius: 50%; font-size: 22px; font-weight: bold; cursor: pointer;
            display: flex; justify-content: center; align-items: center; color: #2d3436;
            user-select: none; -webkit-tap-highlight-color: transparent;
        }
        .btn-calc:active { background-color: #dfe6e9; }
        .counter-value { font-size: 18px; font-weight: bold; width: 24px; text-align: center; color: #2d3436; }

        .summary-bar {
            background: #f5f6fa; border-radius: 12px; padding: 15px;
            margin-top: 25px; display: flex; justify-content: space-between; align-items: center;
        }
        .summary-text { font-size: 15px; color: #2d3436; text-align: left; line-height: 1.4; }
        .total-amount { color: #e74c3c; font-size: 22px; font-weight: bold; }

        /* 大送出按鈕 */
        .btn-submit {
            background: linear-gradient(135deg, #e67e22, #f39c12);
            color: white; width: 100%; padding: 15px; text-align: center;
            border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 15px;
            box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent;
        }
        .btn-submit:active { opacity: 0.9; }

        /* 彈出視窗 */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); z-index: 100; justify-content: center; align-items: center;
        }
        .modal-content {
            background: white; border-radius: 20px; width: 85%; max-width: 380px; padding: 25px;
            text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.2); box-sizing: border-box;
        }
        .success-icon { font-size: 40px; margin-bottom: 5px; }
        .thank-title { font-size: 22px; font-weight: bold; color: #2ecc71; margin-bottom: 10px; }
        .price-box { background-color: #f5f6fa; padding: 10px; border-radius: 10px; margin: 10px 0; font-size: 15px; }
        .price-amount { color: #e74c3c; font-size: 24px; font-weight: bold; }
        
        .text-box-label { font-size: 13px; color: #e67e22; font-weight: bold; text-align: left; margin: 10px 0 5px 0; display: block;}
        textarea { width: 100%; height: 110px; border: 2px dashed #b2bec3; border-radius: 8px; padding: 8px; box-sizing: border-box; font-size: 13px; resize: none; background: #fafafa; }
        
        .amber-notice { color: #636e72; font-size: 13px; line-height: 1.4; margin-top: 12px; text-align: left; border-top: 1px dashed #dfe6e9; padding-top: 10px; }
        .btn-close { background: #e67e22; color: white; padding: 12px 30px; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 15px; width: 100%; font-size: 16px; text-align: center; box-sizing: border-box; }
    </style>
</head>
