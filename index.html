<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐚 幸福海螺 團購單</title>
    <style>
        body { font-family: sans-serif; background: #f5cd79; padding: 20px; display: flex; justify-content: center; }
        .container { background: white; padding: 25px; border-radius: 20px; width: 100%; max-width: 450px; text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .name-group { margin-bottom: 20px; text-align: left; background: #fff8eb; padding: 15px; border-radius: 10px; }
        input[type="text"] { width: 100%; padding: 10px; box-sizing: border-box; border: 2px solid #dfe6e9; border-radius: 8px; font-size: 16px; }
        .menu-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 5px; border-bottom: 1px solid #eee; }
        .counter { display: flex; align-items: center; gap: 15px; }
        .btn-calc { background: #f1f2f6; width: 35px; height: 35px; border-radius: 50%; font-size: 20px; font-weight: bold; cursor: pointer; display: flex; justify-content: center; align-items: center; user-select: none; }
        .btn-calc:active { background: #dfe6e9; }
        .counter-value { font-size: 18px; font-weight: bold; width: 20px; text-align: center; }
        .summary { background: #fafafa; padding: 15px; margin-top: 20px; border-radius: 10px; display: flex; justify-content: space-between; font-weight: bold; }
        .btn-submit { background: #e67e22; color: white; padding: 15px; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 15px; }
        /* 彈窗 */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 100; }
        .modal-content { background: white; padding: 25px; border-radius: 15px; width: 85%; max-width: 350px; text-align: center; }
        textarea { width: 100%; height: 120px; margin-top: 10px; font-size: 13px; resize: none; padding: 5px; box-sizing: border-box; }
        .btn-close { background: #e67e22; color: white; padding: 10px; border-radius: 5px; cursor: pointer; margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>🐚 幸福海螺 團購單</h2>
    <p style="color:#636e72; font-size:14px;">請輸入名字並加減數量，完成後點擊最下方送出</p>

    <div class="name-group">
        <label style="font-weight:bold; display:block; margin-bottom:5px;">👤 您的稱呼：</label>
        <input type="text" id="userName" placeholder="請輸入名字">
    </div>

    <div id="menu-list">
        <!-- 每一行都直接帶有獨立的品名、價格與各自對應的數字 ID -->
        <div class="menu-item" data-price="280" data-name="奶油曲奇">
            <div style="text-align:left;"><b>奶油曲奇</b><br><span style="color:#e67e22;">\$280</span></div>
            <div class="counter"><div class="btn-calc" onclick="minus(0)">-</div><span class="counter-value" id="val_0">0</span><div class="btn-calc" onclick="plus(0)">+</div></div>
        </div>
        <div class="menu-item" data-price="290" data-name="巧克力曲奇">
            <div style="text-align:left;"><b>巧克力曲奇</b><br><span style="color:#e67e22;">\$290</span></div>
            <div class="counter"><div class="btn-calc" onclick="minus(1)">-</div><span class="counter-value" id="val_1">0</span><div class="btn-calc" onclick="plus(1)">+</div></div>
        </div>
        <div class="menu-item" data-price="290" data-name="咖啡曲奇">
            <div style="text-align:left;"><b>咖啡曲奇</b><br><span style="color:#e67e22;">\$290</span></div>
            <div class="counter"><div class="btn-calc" onclick="minus(2)">-</div><span class="counter-value" id="val_2">0</span><div class="btn-calc" onclick="plus(2)">+</div></div>
        </div>
        <div class="menu-item" data-price="330" data-name="三元曲奇">
            <div style="text-align:left;"><b>三元曲奇</b><br><span style="color:#e67e22;">\$330</span></div>
            <div class="counter"><div class="btn-calc" onclick="minus(3)">-</div><span class="counter-value" id="val_3">0</span><div class="btn-calc" onclick="plus(3)">+</div></div>
        </div>
    </div>

    <div class="summary">
        <div>總盒數：<span id="totalItems">0</span> 盒</div>
        <div style="color:#e74c3c;">總金額：\$ <span id="totalPrice">0</span></div>
    </div>

    <div class="btn-submit" onclick="sendOrder()">🎉 確認送出訂單</div>
</div>

<!-- 彈出視窗 -->
<div id="myModal" class="modal">
    <div class="modal-content">
        <h3>🎉 感謝您的訂購！</h3>
        <p>應付總金額：<b style="color:#e74c3c; font-size:20px;">\$ <span id="modalMoney">0</span> 元</b></p>
        <p style="font-size:13px; color:#e67e22; text-align:left; margin-bottom:2px;">👇 請全選並複製下方文字框：</p>
        <textarea id="resultText" readonly></textarea>
        <p style="font-size:13px; color:#636e72; text-align:left; border-top:1px dashed #ccc; padding-top:10px; margin-top:10px;">💡 <b>Amber 提示：</b><br>請複製上方明細貼回 LINE 群組，Amber 確認訂單後會和您收取。</p>
        <div class="btn-close" onclick="closeModal()">複製好了，返回群組</div>
    </div>
</div>

<script>
    // 陣列對應上方的 4 個項目：奶油(0), 巧克力(1), 咖啡(2), 三元(3)
    const itemsData = [
        { name: "奶油曲奇", price: 280, qty: 0 },
        { name: "巧克力曲奇", price: 290, qty: 0 },
        { name: "咖啡曲奇", price: 290, qty: 0 },
        { name: "三元曲奇", price: 330, qty: 0 }
    ];

    function plus(index) {
        itemsData[index].qty++;
        document.getElementById('val_' + index).textContent = itemsData[index].qty;
        updateSummary();
    }

    function minus(index) {
        if (itemsData[index].qty > 0) {
            itemsData[index].qty--;
            document.getElementById('val_' + index).textContent = itemsData[index].qty;
            updateSummary();
        }
    }

    function updateSummary() {
        let totalQty = 0;
        let totalPrice = 0;
        for (let i = 0; i < itemsData.length; i++) {
            totalQty += itemsData[i].qty;
            totalPrice += itemsData[i].qty * itemsData[i].price;
        }
        document.getElementById('totalItems').textContent = totalQty;
        document.getElementById('totalPrice').textContent = totalPrice.toLocaleString();
    }

    function sendOrder() {
        const name = document.getElementById('userName').value.trim();
        if (!name) { alert("請填寫您的稱呼！"); return; }
        
        let totalQty = 0;
        let totalPrice = 0;
        let text = `📝 幸福海螺訂單\n👤 訂購人：${name}\n------------------\n`;
        
        for (let i = 0; i < itemsData.length; i++) {
            if (itemsData[i].qty > 0) {
                text += `🔹 ${itemsData[i].name} x ${itemsData[i].qty}\n`;
                totalQty += itemsData[i].qty;
                totalPrice += itemsData[i].qty * itemsData[i].price;
            }
        }
        
        if (totalQty === 0) { alert("請至少選擇一個口味再送出！"); return; }
        text += `------------------\n💰 總金額：$${totalPrice.toLocaleString()} 元\n\n(Amber確認訂單後會和您收取)`;

        document.getElementById('resultText').value = text;
        document.getElementById('modalMoney').textContent = totalPrice.toLocaleString();
        document.getElementById('myModal').style.display = 'flex';
        
        // 嘗試自動複製
        try { navigator.clipboard.writeText(text); } catch(e) {}
        
        // 自動圈選文字框
        setTimeout(function() {
            const ta = document.getElementById('resultText');
            ta.focus();
            ta.select();
        }, 100);
    }

    function closeModal() {
        document.getElementById('myModal').style.display = 'none';
        document.getElementById('userName').value = "";
        for (let i = 0; i < itemsData.length; i++) {
            itemsData[i].qty = 0;
            document.getElementById('val_' + i).textContent = "0";
        }
        updateSummary();
    }
</script>

</body>
</html>
